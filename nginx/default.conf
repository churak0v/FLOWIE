# Address lookup query strings must not enter access logs.
map $uri $flowie_loggable {
  default 1;
  ~^/api/delivery/(suggest|geocode)$ 0;
}
access_log /var/log/nginx/access.log combined if=$flowie_loggable;

server {
  listen 80;
  server_name _;

  # Use Docker embedded DNS resolver so nginx can resolve service names at runtime.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $api_host api:3001;

  # Phone photos are often several MB; nginx default (1m) causes 413 and "upload doesn't work".
  client_max_body_size 25m;

  root /usr/share/nginx/html;
  index index.html;

  location = /_flowie_app_shell {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }

  # WebSocket upgrade for Socket.IO (realtime chat).
  location /api/socket.io/ {
    proxy_pass http://$api_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://$api_host;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://$api_host;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Public indexable documents are rendered by the API from the same catalog data.
  location = / {
    proxy_pass http://$api_host;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /catalog {
    proxy_pass http://$api_host;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /shop {
    proxy_pass http://$api_host;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /product/ {
    proxy_pass http://$api_host;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /robots.txt {
    proxy_pass http://$api_host;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /sitemap.xml {
    proxy_pass http://$api_host;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # HTML must always revalidate so browsers receive the current bundle after deploy.
  # - Fingerprinted assets can be cached "forever".
  location ~* \.(?:js|css|map|png|jpg|jpeg|gif|svg|webp|ico|mp4|woff2?|ttf)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri /index.html;
  }
}
