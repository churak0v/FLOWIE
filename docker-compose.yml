services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowie}
      POSTGRES_DB: ${POSTGRES_DB:-flowie}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowie} -d ${POSTGRES_DB:-flowie}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${DB_PORT:-56431}:5432"
    volumes:
      - flowie_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowie}:${POSTGRES_PASSWORD:-flowie}@db:5432/${POSTGRES_DB:-flowie}?schema=public
      NODE_ENV: ${NODE_ENV:-development}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me}
      BOT_TOKEN: ${BOT_TOKEN:-change-me}
      ADMIN_BOT_TOKEN: ${ADMIN_BOT_TOKEN:-}
      APP_COOKIE_DOMAIN: ${APP_COOKIE_DOMAIN:-}
      ADMIN_TG_IDS: ${ADMIN_TG_IDS:-}
      DEV_ADMIN_ENABLED: ${DEV_ADMIN_ENABLED:-false}
      DEV_ADMIN_TELEGRAM_ID: ${DEV_ADMIN_TELEGRAM_ID:-local-dev-admin}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      SEO_APP_SHELL_URL: http://web/_flowie_app_shell
      ALFA_BANK_ENABLED: ${ALFA_BANK_ENABLED:-false}
      ALFA_BANK_MODE: ${ALFA_BANK_MODE:-test}
      ALFA_BANK_API_URL: ${ALFA_BANK_API_URL:-}
      ALFA_BANK_USER_NAME: ${ALFA_BANK_USER_NAME:-}
      ALFA_BANK_PASSWORD: ${ALFA_BANK_PASSWORD:-}
      ALFA_BANK_TOKEN: ${ALFA_BANK_TOKEN:-}
      NODE_EXTRA_CA_CERTS: /app/certs/russian-trusted-root-ca.pem
      DELIVERY_TARIFF_RUB: ${DELIVERY_TARIFF_RUB:-}
      DELIVERY_INVOICE_TTL_HOURS: ${DELIVERY_INVOICE_TTL_HOURS:-24}
      YANDEX_MAPS_ENABLED: ${YANDEX_MAPS_ENABLED:-false}
      YANDEX_MAPS_JS_API_KEY: ${YANDEX_MAPS_JS_API_KEY:-}
      YANDEX_MAPS_SUGGEST_API_KEY: ${YANDEX_MAPS_SUGGEST_API_KEY:-}
      YANDEX_MAPS_GEOCODER_API_KEY: ${YANDEX_MAPS_GEOCODER_API_KEY:-}
      CATALOG_EMBEDDINGS_ENABLED: ${CATALOG_EMBEDDINGS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CATALOG_EMBEDDING_MODEL: ${CATALOG_EMBEDDING_MODEL:-text-embedding-3-small}
      CATALOG_EMBEDDING_DIMENSIONS: ${CATALOG_EMBEDDING_DIMENSIONS:-512}
      CATALOG_EMBEDDING_TIMEOUT_MS: ${CATALOG_EMBEDDING_TIMEOUT_MS:-2500}
      CATALOG_SEARCH_MIN_SIMILARITY: ${CATALOG_SEARCH_MIN_SIMILARITY:-0.25}
      CATALOG_REINDEX_MAX_PRODUCTS: ${CATALOG_REINDEX_MAX_PRODUCTS:-2000}
      CATALOG_REINDEX_BATCH_SIZE: ${CATALOG_REINDEX_BATCH_SIZE:-20}
      SMS_AUTH_ENABLED: ${SMS_AUTH_ENABLED:-false}
      SMS_RU_API_ID: ${SMS_RU_API_ID:-}
      SMS_RU_SENDER: ${SMS_RU_SENDER:-}
    ports:
      - "${API_PORT:-6111}:3001"
    volumes:
      - flowie_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:3001}
        VITE_HERO_IMAGE: ${VITE_HERO_IMAGE:-}
        VITE_RECIPIENT_IMAGE: ${VITE_RECIPIENT_IMAGE:-}
        VITE_DISABLE_TELEGRAM_BOOTSTRAP: ${VITE_DISABLE_TELEGRAM_BOOTSTRAP:-false}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-6112}:80"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:3001}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-6113}:80"
    depends_on:
      - api

volumes:
  flowie_pgdata:
  flowie_uploads:
